name: Sync release downloads
on:
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-release-downloads
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Synchronize verified public downloads
        run: node site/scripts/sync-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit changed download metadata
        shell: bash
        run: |
          if git diff --quiet -- site/data/releases.json; then
            echo 'Downloads are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/releases.json
          git commit -m 'Sync published Nook downloads'
          git push origin HEAD:main
